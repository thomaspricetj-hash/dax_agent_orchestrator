[package]
name = "dax_agent_orchestrator"
version = "0.2.1"
edition = "2021"
authors = ["Your Name <you@example.com>"]
license = "MIT"
description = "MAX‑TIER DAX-style orchestrator for cognitive agents, micro‑agents, fractal recursion, merge/collapse engines, and delta routing."
repository = "https://github.com/yourname/dax_agent_orchestrator"
readme = "README.md"
keywords = ["dax", "orchestrator", "agent", "subagent", "delta", "rust", "ai"]
categories = ["development-tools", "asynchronous", "concurrency"]

[dependencies]
anyhow = "1.0"

# Optional runtime and features
tokio = { version = "1.36", features = ["rt-multi-thread", "macros"], optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
metrics = { version = "0.17", optional = true }

# FIXED: async-trait must be optional if included in a feature
async-trait = { version = "0.1", optional = true }

# Core engine dependencies
parking_lot = "0.12"
thiserror = "1.0"

# Optional logging
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true }

[features]
default = []

# Async support
with-async = ["tokio", "async-trait"]

# Serde support
with-serde = ["serde", "serde_json"]

# Metrics support
with-metrics = ["metrics"]

# Logging support
with-tracing = ["tracing", "tracing-subscriber"]

[dev-dependencies]
pretty_assertions = "1.3"

# Keep tokio in dev-deps so examples/tests can run locally without enabling features.
tokio = { version = "1.36", features = ["rt-multi-thread", "macros"] }
