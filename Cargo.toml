[package]
name = "dax_agent_orchestrator"
version = "0.2.0"
edition = "2021"
authors = ["Your Name <you@example.com>"]
license = "MIT"
description = "Drop-in DAX-style orchestrator for splitting agent state into subagents and collapsing deltas."
repository = "https://github.com/yourname/dax_agent_orchestrator"
readme = "README.md"
keywords = ["dax", "orchestrator", "agent", "subagent", "delta", "rust"]
categories = ["development-tools", "asynchronous"]

[dependencies]
anyhow = "1.0"

# Optional runtime and features. Each optional dependency MUST be referenced
# by at least one feature below (Cargo requirement).
tokio = { version = "1.36", features = ["rt-multi-thread", "macros"], optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
metrics = { version = "0.17", optional = true }

[features]
default = []
# Use explicit feature names that map to optional dependency keys.
with-async = ["tokio"]
with-serde = ["serde", "serde_json"]
with-metrics = ["metrics"]

[dev-dependencies]
pretty_assertions = "1.3"
# Keep tokio in dev-deps so examples/tests can run locally without enabling features.
tokio = { version = "1.36", features = ["rt-multi-thread", "macros"] }
